name: Rust spacing
on:
  push:
    paths: ["rust/**", "ts/configs/oxlint.json", ".github/workflows/rust-spacing.yml"]
  pull_request:
    paths: ["rust/**", "ts/configs/oxlint.json", ".github/workflows/rust-spacing.yml"]
permissions:
  contents: read
jobs:
  spacing:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev,llvm-tools-preview,rust-src,rustfmt
      - run: cargo +nightly-2026-08-20 install cargo-dylint dylint-link --version 6.2.0 --locked
      - run: cargo +stable fmt --manifest-path rust/spacing/Cargo.toml --all --check
      - run: python3 rust/spacing/tests/test_spacing.py -v
