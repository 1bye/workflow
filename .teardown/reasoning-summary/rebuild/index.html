<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reasoning summary</title>
    <style>
      :root {
        /* Scale: 0.5 CSS px per native raster px from the teardown estimates. */
        --color-surface-base: #f2f2f2;
        --color-surface-raised: #f8f8f8;
        --color-text-default: #262628;
        --color-text-muted: #707077;
        --color-border-default: #eae9ee;
        --color-activity-search: #bc5bfa;
        --color-activity-read: #73d0a3;
        --color-activity-code: #ff9c40;
        --color-activity-write: #3b82f4;
        --color-chart-remainder: #e4e3e8;
        --color-badge-surface: #dbeaff;
        --color-badge-text: #3882fb;
        --color-brand-opus: #d77b56;
        --space-card-inset: 24px;
        --space-segment: 4px;
        --space-label: 10px;
        --space-legend-row: 35px;
        --space-model-row: 48px;
        --radius-card: 25px;
        --radius-badge: 12px;
        --radius-segment: 4px;
        --size-legend-key: 12.5px;
        --size-provider-icon: 24px;
        --size-status-dot: 8px;
        --size-source-avatar: 24px;
        --font-body: 20.5px;
        --font-badge: 15.5px;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-width: 280px;
        background: var(--color-surface-base);
        color: var(--color-text-default);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: var(--font-body);
        line-height: 1.2;
        -webkit-font-smoothing: antialiased;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .summary-card {
        width: min(623px, 100%);
        overflow: hidden;
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-card);
        background: var(--color-surface-raised);
      }

      .run-summary,
      .model-attribution,
      .source-footer { padding-inline: var(--space-card-inset); }

      /* Half-scale anatomy target: approximately 165px for this top band. */
      .run-summary { padding-top: 20px; padding-bottom: 12px; }

      .run-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      .run-title,
      .run-steps { margin: 0; }

      .run-title {
        color: var(--color-text-muted);
        font-weight: 400;
      }

      .run-title strong {
        color: var(--color-text-default);
        font-weight: 500;
      }

      .run-steps {
        flex: 0 0 auto;
        color: var(--color-text-muted);
      }

      .activity-figure { margin: 14px 0 0; }

      .activity-bar {
        display: grid;
        grid-template-columns: 21fr 14fr 9fr 18fr 38fr;
        gap: var(--space-segment);
        width: 100%;
        height: 10px;
      }

      .activity-segment {
        min-width: 0;
        border-radius: var(--radius-segment);
      }

      .activity-segment--search { background: var(--color-activity-search); }
      .activity-segment--read { background: var(--color-activity-read); }
      .activity-segment--code { background: var(--color-activity-code); }
      .activity-segment--write { background: var(--color-activity-write); }
      .activity-segment--remainder { background: var(--color-chart-remainder); }

      .activity-legend {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(2, auto);
        column-gap: 24px;
        row-gap: 0;
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
      }

      .activity-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        min-height: var(--space-legend-row);
        gap: 12px;
      }

      .activity-label {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        gap: var(--space-label);
      }

      .activity-key {
        display: inline-block;
        width: var(--size-legend-key);
        height: var(--size-legend-key);
        flex: 0 0 auto;
        border-radius: 3px;
      }

      .activity-key--search { background: var(--color-activity-search); }
      .activity-key--read { background: var(--color-activity-read); }
      .activity-key--code { background: var(--color-activity-code); }
      .activity-key--write { background: var(--color-activity-write); }

      .activity-name { color: var(--color-text-muted); white-space: nowrap; }
      .activity-time { color: var(--color-text-default); white-space: nowrap; }

      .model-attribution {
        /* Two 48px model rows plus compact insets target approximately 124px. */
        padding-top: 14px;
        padding-bottom: 13px;
        border-top: 1px solid var(--color-border-default);
      }

      .model-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }

      .model-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        min-height: var(--space-model-row);
        gap: 16px;
      }

      .model-identity,
      .model-task { display: flex; align-items: center; min-width: 0; }
      .model-identity { gap: 10px; }
      .model-task { justify-content: flex-end; gap: 8px; color: var(--color-text-muted); }

      .provider-mark {
        width: var(--size-provider-icon);
        height: var(--size-provider-icon);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
      }

      .provider-mark svg { display: block; width: 100%; height: 100%; }

      .model-name { white-space: nowrap; }

      .effort-badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: var(--radius-badge);
        background: var(--color-badge-surface);
        color: var(--color-badge-text);
        font-size: var(--font-badge);
        line-height: 1;
        white-space: nowrap;
      }

      .model-time {
        min-width: 38px;
        color: var(--color-text-default);
        text-align: right;
        white-space: nowrap;
      }

      .status-dot {
        width: var(--size-status-dot);
        height: var(--size-status-dot);
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--color-activity-read);
      }

      .source-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 65px;
        border-top: 1px solid var(--color-border-default);
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .source-provenance { display: flex; align-items: center; min-width: 0; gap: 10px; }

      .source-avatars {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        padding-left: 8px;
      }

      .source-avatar {
        width: var(--size-source-avatar);
        height: var(--size-source-avatar);
        margin-left: -8px;
        border: 2px solid var(--color-surface-raised);
        border-radius: 50%;
      }

      .source-avatar--search { background: var(--color-activity-search); }
      .source-avatar--read { background: var(--color-activity-read); }
      .source-avatar--code { background: var(--color-activity-code); }

      .source-copy {
        min-width: 0;
        color: var(--color-text-muted);
        white-space: nowrap;
      }

      .details-button {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 7px;
        min-height: 40px;
        margin: -4px -8px -4px 0;
        padding: 4px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-text-default);
        font: inherit;
        cursor: pointer;
      }

      .details-button:hover { background: rgba(38, 38, 40, .05); }
      .details-button:focus-visible { outline: 2px solid var(--color-badge-text); outline-offset: 2px; }
      .details-chevron { font-size: 1.2em; line-height: 0; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        :root {
          --space-card-inset: 16px;
          --font-body: 17px;
          --font-badge: 13px;
          --space-legend-row: 31px;
          --space-model-row: 44px;
        }

        main { padding: 16px 10px; }
        .run-summary { padding-top: 20px; padding-bottom: 12px; }
        .activity-figure { margin-top: 14px; }
        .activity-legend { column-gap: 14px; margin-top: 14px; }
        .activity-item { gap: 8px; }
        .model-row { gap: 10px; }
        .model-identity { gap: 7px; }
        .model-task { gap: 5px; }
        .source-footer { gap: 8px; }
        .source-copy { font-size: .9em; }
        .details-button { font-size: .9em; }
      }

      @media (max-width: 380px) {
        :root { --font-body: 15px; }
        .effort-badge { padding-inline: 7px; }
        .model-row { grid-template-columns: minmax(0, 1fr) auto; }
        .model-task { gap: 3px; }
        .source-copy { font-size: .8em; }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="summary-card" aria-labelledby="summary-title">
        <section class="run-summary" aria-labelledby="summary-title">
          <header class="run-header">
            <p class="run-title" id="summary-title">Reasoned for <strong>6.2s</strong></p>
            <p class="run-steps">8 steps</p>
          </header>

          <figure class="activity-figure" aria-labelledby="activity-caption">
            <figcaption class="sr-only" id="activity-caption">
              Activity timing: Search 2.1 seconds, Read 1.4 seconds, Code 0.9 seconds, Write 1.8 seconds.
            </figcaption>
            <div class="activity-bar" aria-hidden="true">
              <span class="activity-segment activity-segment--search"></span>
              <span class="activity-segment activity-segment--read"></span>
              <span class="activity-segment activity-segment--code"></span>
              <span class="activity-segment activity-segment--write"></span>
              <span class="activity-segment activity-segment--remainder"></span>
            </div>
            <ul class="activity-legend" aria-label="Activity durations">
              <li class="activity-item">
                <span class="activity-label"><span class="activity-key activity-key--search" aria-hidden="true"></span><span class="activity-name">Search</span></span>
                <span class="activity-time">2.1s</span>
              </li>
              <li class="activity-item">
                <span class="activity-label"><span class="activity-key activity-key--read" aria-hidden="true"></span><span class="activity-name">Read</span></span>
                <span class="activity-time">1.4s</span>
              </li>
              <li class="activity-item">
                <span class="activity-label"><span class="activity-key activity-key--code" aria-hidden="true"></span><span class="activity-name">Code</span></span>
                <span class="activity-time">0.9s</span>
              </li>
              <li class="activity-item">
                <span class="activity-label"><span class="activity-key activity-key--write" aria-hidden="true"></span><span class="activity-name">Write</span></span>
                <span class="activity-time">1.8s</span>
              </li>
            </ul>
          </figure>
        </section>

        <section class="model-attribution" aria-label="Model attribution">
          <ul class="model-list">
            <li class="model-row">
              <div class="model-identity">
                <!-- shortcut: provider marks are approximated, upgrade when owner assets are available. -->
                <span class="provider-mark" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9.3" stroke="currentColor" stroke-width="1.7" opacity=".18"/>
                    <path d="M7.2 12.1 9.7 8l4.6.1 2.5 4-2.5 3.9-4.6-.1-2.5-3.8Z" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
                    <path d="m9.7 8 4.6 7.9M14.3 8.1l-4.6 7.8" stroke="currentColor" stroke-width="1.1" opacity=".65"/>
                  </svg>
                </span>
                <span class="model-name">GPT 6 Astra</span>
                <span class="effort-badge">Low</span>
              </div>
              <div class="model-task"><span>Planning</span><span class="model-time">2.4s</span></div>
            </li>

            <li class="model-row">
              <div class="model-identity">
                <span class="provider-mark" aria-hidden="true" style="color: var(--color-brand-opus)">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6.2 6.6c2.3-2.2 6.2-2.7 9-.7 2.7 1.9 3.2 5.3 1.6 7.9-1.4 2.4-4.8 3.8-7.6 2.5-2.6-1.2-3.5-4.2-1.9-6.3 1.3-1.8 4-2.6 5.9-1.3 1.8 1.2 1.9 3.6.5 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="7" cy="17.2" r="1.2" fill="currentColor"/>
                  </svg>
                </span>
                <span class="model-name">Opus 5.5</span>
                <span class="effort-badge">High</span>
              </div>
              <div class="model-task"><span class="status-dot" aria-hidden="true"></span><span>Writing</span><span class="model-time">3.8s</span></div>
            </li>
          </ul>
        </section>

        <footer class="source-footer">
          <div class="source-provenance">
            <div class="source-avatars" aria-hidden="true">
              <span class="source-avatar source-avatar--search"></span>
              <span class="source-avatar source-avatar--read"></span>
              <span class="source-avatar source-avatar--code"></span>
            </div>
            <span class="source-copy">24 sources from @shedsgns</span>
          </div>
          <button class="details-button" type="button" aria-label="Details" data-event="reasoning-summary-details">
            <span>Details</span><span class="details-chevron" aria-hidden="true">›</span>
          </button>
        </footer>
      </article>
    </main>

    <script>
      // The pictured destination is unknown; expose an honest integration hook instead.
      document.querySelector('[data-event="reasoning-summary-details"]').addEventListener('click', () => {
        window.dispatchEvent(new CustomEvent('reasoning-summary:details', {
          detail: { sourceCount: 24, stepCount: 8, elapsedSeconds: 6.2 }
        }));
      });
    </script>
  </body>
</html>
